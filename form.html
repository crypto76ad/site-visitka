<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Yanone+Kaffeesatz:wght@200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Merkasimov_Andrey</title>
</head>
<body>
    <div id="wrapper">
        <header class="clearfix">
            <a id="logo" href="index.html"><span class="pink" >Сайт</span> <i>визитка</i></a>
            <nav id="mainnav">
                <ul>
                    <li><a href="uslugi.html">услуги</a></li>
                    <li><a href="about_us.html">о нас</a></li>
                    <li><a href="clients.html">клиенты</a></li>
                    <li><a href="contacts.html">контакты</a></li>
                </ul>
            </nav>
        </header>
        <main> 
            <form id="contact-form" action="">
                <div class="form_item">
                    <label for="topic">Тема</label><br>
                    <select name="topic" id="topic">
                        <option value="1">Заказать услугу</option>
                        <option value="2">Оставить отзыв/замечание</option>
                        <option value="3">Предложить сотрудничество</option>
                        <option value="4">Другое</option>
                    </select>
                </div>
                
                <div class="form_item">
                    <label for="name">Имя<span class="custom-tooltip" data-title="Обязательно!">*</span></label><br>
                    <input required name="name" id="name" type="text" placeholder="Введите ваше имя">
                </div>

                <div class="form_item">
                    <label for="mail">E-mail<span class="custom-tooltip" data-title="Обязательно!">*</span></label><br>
                    <input required name="mail" id="mail" type="email" placeholder="Введите вашу почту">
                </div>

                <div class="form_item">
                    <label for="tel">Телефон</label><br>
                    <input name="tel" id="tel" type="tel" placeholder="Введите ваш телефон">
                </div>

                <div class="form_item">
                    <label for="date">Дата отправки<span class="custom-tooltip" data-title="Обязательно!">*</span></label><br>
                    <input required name="date" id="date" type="date">
                </div>

                <div class="form_item">
                    <label for="comments">Текст сообщения<span class="custom-tooltip" data-title="Обязательно!">*</span></label><br>
                    <textarea required cols="30" rows="10" name="comments" maxlength="350" placeholder="Наберите сообщение (Подробно опишите детали!)"></textarea>
                </div>
                <div class="form_item">
                    <input required name="ckbx" id="ckbx" type="checkbox">
                    <label for="ckbx"><a href="">Согласие</a> на обработку данных<span class="custom-tooltip" data-title="Обязательно!">*</span></label>
                </div>

                <div class="form_item">
                    <input type="submit">
                </div>
            </form>
        </main>
    </div>
    <footer>
        <a id="footelem" href="form.html" class="footer_block">Написать нам &#9650;</a>
        <a class="footer_block">&copy; Новая компания</a>
        <div class="footer_icons">
            <a href="" target="_blank">
                <img class="footer_img" src="mailru.png" alt="kartinka">
            </a>
            <a href="" target="_blank">
                <img class="footer_img" src="ok.png" alt="kartinka">
            </a>
            <a href="" target="_blank">
                <img class="footer_img" src="vk.png" alt="kartinka">
            </a>
        </div>
    </footer>
</body>
</html>
